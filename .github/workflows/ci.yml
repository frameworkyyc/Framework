# Automated tests. This workflow ONLY runs the test suite: no deployment, no secrets, read-only token.
# Cloudflare deploys on its own (Workers Builds); this check reports results and, once the `main` ruleset requires it, gates merges to main.
# The job name "Node tests" is the required-check name: do not rename it without updating the branch ruleset.
# Actions are pinned to full commit SHAs (verified against the upstream tags noted beside each).
name: CI

on:
  push:
    branches: [Staging, main]
  pull_request:
    branches: [Staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require Node 22.13 or newer (node:sqlite)
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); console.log('node', process.version); if (a<22||(a===22&&b<13)) { console.error('Node 22.13+ required'); process.exit(1); }"
      - name: Run the test suite
        run: node --test worker/test/*.test.mjs
