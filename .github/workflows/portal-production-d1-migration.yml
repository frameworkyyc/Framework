# Manually triggered Production portal D1 migration (framework-portal). NOT part of CI: it never runs automatically.
#   * workflow_dispatch only. Default mode is verify-only (read-only: checks the target, lists pending migrations, lists tables).
#   * "apply" additionally needs the database name typed exactly. It applies ONLY migrations that are actually pending, and only when the pre-checks pass:
#       - the pending list must be a TAIL of the known, ordered list (0001 to 0008 in .github/scripts/portal-d1-check.mjs): nothing unknown, nothing skipped, nothing out of order;
#       - the tables already in the database must be EXACTLY what the already-applied migrations create (an empty database when 0001 is pending; the 0001 tables when 0002 is next);
#       - after applying, nothing may be pending and the tables and indexes must be exactly the expected sets.
#     Anything else fails closed before any change is made. With nothing pending, apply refuses to run.
#   * Runs in the GitHub environment "production-portal-d1". Required reviewers on that environment are what make a human approve each run;
#     this file cannot create or verify that protection (see migrations/portal/README.md). The Cloudflare secrets live in that environment only.
#   * Only runs with ref Staging (where the migration config and SQL live); the file also exists on main only so GitHub lists it.
#   * Wrangler is installed in a step that has no secrets, with install scripts disabled, at an exact version at least two weeks old.
#   * One run at a time (concurrency, never cancelled mid-run). Read-only repository token. Actions pinned to full commit SHAs.
# Required environment secrets (names only; never put values in the repository): CLOUDFLARE_API_TOKEN (D1 edit only), CLOUDFLARE_ACCOUNT_ID.
name: Portal Production D1 migration

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: "Type the Production database name exactly: framework-portal"
        required: true
        type: string
      mode:
        description: "verify-only checks and reports; apply also applies the pending migrations (only if every pre-check passes)"
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - apply

permissions:
  contents: read

concurrency:
  group: portal-production-d1-migration
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.147.0"
  WRANGLER_SEND_METRICS: "false"
  CONFIG: migrations/portal/wrangler.migrate.production.jsonc

jobs:
  migrate:
    name: Verify / apply Production portal D1 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-portal-d1
    steps:
      - name: Check the inputs and the branch
        env:
          CONFIRM_DATABASE: ${{ inputs.confirm_database }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM_DATABASE" != "framework-portal" ]; then echo "FAIL: the typed database name does not match."; exit 1; fi
          if [ "$MODE" != "verify-only" ] && [ "$MODE" != "apply" ]; then echo "FAIL: unknown mode."; exit 1; fi
          if [ "$REF" != "refs/heads/Staging" ]; then echo "FAIL: run this only with ref Staging (the migration config and SQL live there)."; exit 1; fi
          echo "mode: $MODE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Wrangler (no secrets in this step, no install scripts)
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund --no-save "wrangler@$WRANGLER_VERSION"
      - name: Check the migration config targets only the Production portal database
        run: node .github/scripts/portal-d1-check.mjs config "$CONFIG"
      - name: Verify the remote database name and id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 info PORTAL_DB --json -c "$CONFIG" > "$RUNNER_TEMP/info.json"
          node .github/scripts/portal-d1-check.mjs info < "$RUNNER_TEMP/info.json"
      - name: List pending migrations (before)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations list PORTAL_DB --remote -c "$CONFIG" > "$RUNNER_TEMP/pending-before.txt"
          node .github/scripts/portal-d1-check.mjs pending-before "$MODE" < "$RUNNER_TEMP/pending-before.txt"
      - name: List tables (before, read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/tables-before.json"
          node .github/scripts/portal-d1-check.mjs tables-before "$MODE" "$RUNNER_TEMP/pending-before.txt" < "$RUNNER_TEMP/tables-before.json"
      - name: Apply the pending migrations (the checks above have confirmed exactly which)
        if: ${{ inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations apply PORTAL_DB --remote -c "$CONFIG"
      - name: Verify completion (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations list PORTAL_DB --remote -c "$CONFIG" > "$RUNNER_TEMP/pending-after.txt"
          node .github/scripts/portal-d1-check.mjs pending-after < "$RUNNER_TEMP/pending-after.txt"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/tables-after.json"
          node .github/scripts/portal-d1-check.mjs tables-after < "$RUNNER_TEMP/tables-after.json"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='index' ORDER BY name" > "$RUNNER_TEMP/indexes-after.json"
          node .github/scripts/portal-d1-check.mjs indexes-after < "$RUNNER_TEMP/indexes-after.json"
