# Manually triggered STAGING portal D1 migration (framework-portal-staging). NOT part of CI: it never runs automatically. Built from the Production migration workflow and kept separate from it on purpose.
#   * workflow_dispatch only. Default mode is verify-only (read-only: checks the target, lists pending migrations, lists tables, records a recovery bookmark).
#   * It can only ever target the Staging database: the config must name framework-portal-staging AND its id, the remote name and id are checked again, and the Production database id and name are refused outright.
#   * "apply" additionally needs the database name typed exactly. It applies ONLY migrations that are actually pending AND listed as applicable in .github/scripts/portal-staging-d1-check.mjs, and only when the pre-checks pass.
#     Anything unexpected (another pending migration, a missing table, a wrong database) fails closed before any change is made. With nothing pending, apply refuses to run.
#   * Both modes record a D1 Time Travel bookmark (read-only) after the checks and before any apply; it is printed in the log and the job summary, and the run stops (apply never starts) if none is obtained.
#   * After an apply it checks that nothing is pending, the table list is unchanged, the new columns exist, and the existing screenshot data is unchanged.
#   * Runs in the GitHub environment "staging-portal-d1". Required reviewers on that environment are what make a human approve each run; this file cannot create or verify that protection.
#     The Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) live in that environment only and are passed per step, never echoed.
#   * Only runs with ref Staging (where the migration config and SQL live).
#   * Wrangler is installed in a step that has no secrets, with install scripts disabled, at an exact version at least two weeks old.
#   * One run at a time (own concurrency group, never cancelled mid-run). Read-only repository token. Actions pinned to full commit SHAs.
name: Portal Staging D1 migration

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: "Type the Staging database name exactly: framework-portal-staging"
        required: true
        type: string
      mode:
        description: "verify-only checks and reports; apply also applies the pending migrations (only if every pre-check passes)"
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - apply

permissions:
  contents: read

concurrency:
  group: portal-staging-d1-migration
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.147.0"
  WRANGLER_SEND_METRICS: "false"
  CONFIG: migrations/portal/wrangler.migrate.staging.jsonc

jobs:
  migrate:
    name: Verify / apply Staging portal D1 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-portal-d1
    steps:
      - name: Check the inputs and the branch
        env:
          CONFIRM_DATABASE: ${{ inputs.confirm_database }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM_DATABASE" != "framework-portal-staging" ]; then echo "FAIL: the typed database name does not match."; exit 1; fi
          if [ "$MODE" != "verify-only" ] && [ "$MODE" != "apply" ]; then echo "FAIL: unknown mode."; exit 1; fi
          if [ "$REF" != "refs/heads/Staging" ]; then echo "FAIL: run this only with ref Staging (the migration config and SQL live there)."; exit 1; fi
          echo "mode: $MODE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Wrangler (no secrets in this step, no install scripts)
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund --no-save "wrangler@$WRANGLER_VERSION"
      - name: Check the migration config targets only the Staging portal database
        run: node .github/scripts/portal-staging-d1-check.mjs config "$CONFIG"
      - name: Verify the remote database name and id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 info PORTAL_DB --json -c "$CONFIG" > "$RUNNER_TEMP/info.json"
          node .github/scripts/portal-staging-d1-check.mjs info < "$RUNNER_TEMP/info.json"
      - name: List pending migrations (before)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations list PORTAL_DB --remote -c "$CONFIG" > "$RUNNER_TEMP/pending-before.txt"
          node .github/scripts/portal-staging-d1-check.mjs pending-before "$MODE" < "$RUNNER_TEMP/pending-before.txt"
      - name: List tables (before, read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/tables-before.json"
          node .github/scripts/portal-staging-d1-check.mjs tables-before < "$RUNNER_TEMP/tables-before.json"
      - name: Fingerprint the existing screenshot data (before, read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT count(*) AS websites, count(screenshot_key) AS with_screenshot, COALESCE(sum(screenshot_size), 0) AS bytes, COALESCE(group_concat(screenshot_sha256, ','), '') AS hashes FROM (SELECT screenshot_key, screenshot_size, screenshot_sha256 FROM websites ORDER BY id)" > "$RUNNER_TEMP/fingerprint-before.json"
          node .github/scripts/portal-staging-d1-check.mjs fingerprint "$RUNNER_TEMP/fingerprint-before.txt" < "$RUNNER_TEMP/fingerprint-before.json"
      - name: Record a Time Travel recovery bookmark (read-only; stops the run if none is obtained)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 time-travel info PORTAL_DB --json -c "$CONFIG" > "$RUNNER_TEMP/bookmark-info.txt"
          node .github/scripts/portal-staging-d1-check.mjs bookmark "$RUNNER_TEMP/bookmark.txt" < "$RUNNER_TEMP/bookmark-info.txt"
      - name: Apply the pending migrations (the checks above have confirmed exactly which)
        if: ${{ inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -s "$RUNNER_TEMP/bookmark.txt" || { echo "FAIL: no recovery bookmark was recorded; nothing is applied."; exit 1; }
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations apply PORTAL_DB --remote -c "$CONFIG"
      - name: Verify completion (apply only)
        if: ${{ inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 migrations list PORTAL_DB --remote -c "$CONFIG" > "$RUNNER_TEMP/pending-after.txt"
          node .github/scripts/portal-staging-d1-check.mjs pending-after < "$RUNNER_TEMP/pending-after.txt"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > "$RUNNER_TEMP/tables-after.json"
          node .github/scripts/portal-staging-d1-check.mjs tables-after "$RUNNER_TEMP/tables-before.json" < "$RUNNER_TEMP/tables-after.json"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT name FROM pragma_table_info('websites') ORDER BY name" > "$RUNNER_TEMP/columns-after.json"
          node .github/scripts/portal-staging-d1-check.mjs columns-after < "$RUNNER_TEMP/columns-after.json"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" d1 execute PORTAL_DB --remote -c "$CONFIG" --json --command "SELECT count(*) AS websites, count(screenshot_key) AS with_screenshot, COALESCE(sum(screenshot_size), 0) AS bytes, COALESCE(group_concat(screenshot_sha256, ','), '') AS hashes FROM (SELECT screenshot_key, screenshot_size, screenshot_sha256 FROM websites ORDER BY id)" > "$RUNNER_TEMP/fingerprint-after.json"
          node .github/scripts/portal-staging-d1-check.mjs fingerprint "$RUNNER_TEMP/fingerprint-after.txt" < "$RUNNER_TEMP/fingerprint-after.json"
          node .github/scripts/portal-staging-d1-check.mjs fingerprint-compare "$RUNNER_TEMP/fingerprint-before.txt" "$RUNNER_TEMP/fingerprint-after.txt"
